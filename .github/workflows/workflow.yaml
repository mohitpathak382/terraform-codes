name: 'IaC Workflow | Terraform'

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  WIF_PROVIDER: 'projects/288657159168/locations/global/workloadIdentityPools/githubactionspool/providers/test-github-actions'
  SA: 'xyz-345@quantiphi-test-470710.iam.gserviceaccount.com'
  ACCESS_TOKEN_LIFETIME: 900s
  GCP_PROJECT: 'quantiphi-test-470710'

jobs:
  terraform_plan:
    name: 'Terraform | Plan'
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'

    outputs:
      changed_files: ${{ steps.changed-dirs-files.outputs.FOLDER_LIST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA }}
          access_token_lifetime: ${{ env.ACCESS_TOKEN_LIFETIME }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'
          terraform_wrapper: false

      - name: Get changed Terraform files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_ignore: |
            .github/**
            modules/**
          files: |
            **/*.tf
            **/*.tfvars

      - name: Get changed root folders
        id: changed-dirs-files
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          echo "${ALL_CHANGED_FILES}" \
            | tr ' ' '\n' \
            | sed 's|\(.*\)/.*|\1|' \
            | sort -u > changed-dirs.txt

          FOLDER=$(tr '\n' ' ' < changed-dirs.txt)

          echo "FOLDER_LIST=$FOLDER"
          echo "FOLDER_LIST=$FOLDER" >> "$GITHUB_OUTPUT"

      - name: Build dynamic tfvars
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          if [ ! -f "secret-manager-config.json" ]; then
            echo "secret-manager-config.json not found!"
            exit 1
          fi

          mkdir -p secret-manager

          TFVARS_FILE="secret-manager/dynamic_secrets.auto.tfvars"

          echo "dynamic_secrets = {" > "$TFVARS_FILE"

          SECRET_NAMES=$(jq -r 'to_entries[] | .value[]' secret-manager-config.json | sort -u)

          for secret_name in $SECRET_NAMES; do

            secret_value=$(echo "$ALL_SECRETS" | jq -r --arg key "$secret_name" '.[$key] // empty')

            if [ -n "$secret_value" ] && [ "$secret_value" != "null" ]; then
              echo "  \"$secret_name\" = \"$secret_value\"" >> "$TFVARS_FILE"
              echo "✓ Loaded secret: $secret_name"
            else
              echo "⚠️ Missing GitHub secret: $secret_name"
              echo "  \"$secret_name\" = \"\"" >> "$TFVARS_FILE"
            fi

          done

          echo "}" >> "$TFVARS_FILE"

          echo "Generated $TFVARS_FILE"

      - name: Terraform Init & Plan
        shell: bash
        run: |
          FOLDER_LIST=$(echo "${{ steps.changed-dirs-files.outputs.FOLDER_LIST }}" | tr ' ' '\n')

          PLAN_FILE="$RUNNER_TEMP/terraform-plan.txt"
          touch "$PLAN_FILE"

          if [ -z "$FOLDER_LIST" ]; then
            echo "No Terraform folders changed."

            {
              echo "# Terraform Plan"
              echo ""
              echo "No Terraform changes detected."
            } > terraform-plan.txt

            cat terraform-plan.txt >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for folder in $FOLDER_LIST; do

            if [ ! -f "$folder/main.tf" ]; then
              echo "Skipping $folder (not a Terraform root module)"
              continue
            fi

            echo "=================================================="
            echo "Processing folder: $folder"
            echo "=================================================="

            (
              cd "$folder"

              terraform init -input=false

              terraform plan \
                -input=false \
                -no-color \
                -out=tfplan

              {
                echo "# Terraform Plan - $folder"
                echo ""
                echo '```terraform'
                terraform show -no-color tfplan
                echo '```'
                echo ""
              } >> "$PLAN_FILE"
            )
          done

          cp "$PLAN_FILE" terraform-plan.txt

          cat terraform-plan.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Publish PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan
          path: terraform-plan.txt

  terraform_apply:
    name: 'Terraform | Apply'
    runs-on: ubuntu-latest
    needs: terraform_plan
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA }}
          access_token_lifetime: ${{ env.ACCESS_TOKEN_LIFETIME }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'
          terraform_wrapper: false

      - name: Build dynamic tfvars
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          if [ ! -f "secret-manager-config.json" ]; then
            echo "secret-manager-config.json not found!"
            exit 1
          fi

          mkdir -p secret-manager

          TFVARS_FILE="secret-manager/dynamic_secrets.auto.tfvars"

          echo "dynamic_secrets = {" > "$TFVARS_FILE"

          SECRET_NAMES=$(jq -r 'to_entries[] | .value[]' secret-manager-config.json | sort -u)

          for secret_name in $SECRET_NAMES; do

            secret_value=$(echo "$ALL_SECRETS" | jq -r --arg key "$secret_name" '.[$key] // empty')

            if [ -n "$secret_value" ] && [ "$secret_value" != "null" ]; then
              echo "  \"$secret_name\" = \"$secret_value\"" >> "$TFVARS_FILE"
            else
              echo "  \"$secret_name\" = \"\"" >> "$TFVARS_FILE"
            fi

          done

          echo "}" >> "$TFVARS_FILE"

      - name: Terraform Apply
        shell: bash
        run: |
          FOLDER_LIST=$(echo "${{ needs.terraform_plan.outputs.changed_files }}" | tr ' ' '\n')

          if [ -z "$FOLDER_LIST" ]; then
            echo "No Terraform folders changed."
            exit 0
          fi

          for folder in $FOLDER_LIST; do

            if [ ! -f "$folder/main.tf" ]; then
              echo "Skipping $folder"
              continue
            fi

            echo "Applying folder: $folder"

            (
              cd "$folder"

              terraform init -input=false

              terraform apply \
                -input=false \
                -auto-approve
            )
          done